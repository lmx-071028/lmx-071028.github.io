<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="5; url=https://echofeild.com/" />
    <title>旧博客已停用</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: #080b12;
        color: #edf3ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(117, 151, 255, 0.14), transparent 32rem),
          radial-gradient(circle at 80% 70%, rgba(130, 211, 231, 0.1), transparent 28rem),
          #080b12;
      }

      main {
        width: min(560px, calc(100vw - 48px));
        padding: 36px;
        border: 1px solid rgba(170, 190, 225, 0.18);
        border-radius: 18px;
        background: rgba(13, 18, 30, 0.78);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(30px, 7vw, 56px);
        line-height: 1;
      }

      p {
        margin: 0 0 14px;
        color: #aebbd0;
        font-size: 17px;
        line-height: 1.7;
      }

      a {
        color: #9fb3ff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>旧博客已停用</h1>
      <p>这个 GitHub Pages 站点已经下线，内容迁移到新的 Next.js / Vercel 博客。</p>
      <p>5 秒后将跳转到 <a href="https://echofeild.com/">echofeild.com</a>。</p>
    </main>
  </body>
</html>
